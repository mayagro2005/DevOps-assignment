name: CI/CD Pipeline

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}
      DOCKERHUB_USERNAME:   ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN:      ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Check S3 backend exists
        run: |
          if ! aws s3 ls s3://maya-terraform-state-123456 >/dev/null 2>&1; then
            echo "Backend S3 bucket does not exist! Run bootstrap workflow first."
            exit 1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Apply (Main)
        run: terraform apply -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-app:latest .

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/java-devops-app:latest
