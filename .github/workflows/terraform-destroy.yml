name: Terraform Destroy

on:
  workflow_dispatch:   # Can run manually from GitHub UI

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # --- Destroy main infrastructure (EC2, Security Groups, etc.) ---
      - name: Terraform Init Main
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Destroy Main
        run: terraform destroy -auto-approve -var "aws_region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform

      # --- Destroy bootstrap resources (S3 + DynamoDB) using AWS CLI ---
      - name: Delete DynamoDB Table
        run: |
          echo "Deleting DynamoDB table: terraform-locks"
          aws dynamodb delete-table --table-name terraform-locks --region $AWS_REGION

      - name: Delete S3 Backend Bucket (all versions)
        run: |
          BUCKET="maya-terraform-state-123456"
          echo "Deleting all objects and versions in S3 bucket: $BUCKET"

          # List all object versions and delete them
          aws s3api list-object-versions --bucket $BUCKET --query 'Versions[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          # List all delete markers and delete them
          aws s3api list-object-versions --bucket $BUCKET --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          # Finally remove the bucket
          aws s3 rb s3://$BUCKET

