name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269809345657:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # --- Destroy main infrastructure ---
      - name: Terraform Init Main
        run: terraform init -reconfigure
        working-directory: ./terraform

      
      - name: Force unlock Terraform state (optional)
        run: terraform force-unlock -force 25ec7cf7-292e-8698-6568-b92d12d40391
        working-directory: ./terraform

      - name: Terraform Destroy Main
        run: terraform destroy -auto-approve -var "aws_region=eu-central-1"
        working-directory: ./terraform

      # --- Delete bootstrap resources (S3 + DynamoDB) ---
      - name: Delete DynamoDB Table
        run: |
          echo "Deleting DynamoDB table: terraform-locks"
          aws dynamodb delete-table --table-name terraform-locks --region eu-central-1

      - name: Delete S3 Backend Bucket (all versions)
        run: |
          BUCKET="maya-terraform-state-123456"
          echo "Deleting all objects and versions in S3 bucket: $BUCKET"

          # List all object versions and delete them
          aws s3api list-object-versions --bucket $BUCKET --query 'Versions[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          # List all delete markers and delete them
          aws s3api list-object-versions --bucket $BUCKET --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          # Finally remove the bucket
          aws s3 rb s3://$BUCKET
