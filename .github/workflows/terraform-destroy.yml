name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269809345657:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Ensure DynamoDB lock table exists
        run: |
          if ! aws dynamodb describe-table --table-name terraform-locks >/dev/null 2>&1; then
            echo "Creating terraform-locks table"
            aws dynamodb create-table \
              --table-name terraform-locks \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name terraform-locks
          else
            echo "Lock table already exists"
          fi

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./terraform

      - name: Terraform Destroy Main
        run: |
          terraform destroy -auto-approve \
            -var="aws_region=eu-central-1" \
            -var="docker_image=dummy" \
            -var="docker_username=dummy" \
            -var="docker_token=dummy"
        working-directory: ./terraform


  backend-destroy:
    needs: terraform-destroy
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::269809345657:role/github-actions-terraform
          aws-region: eu-central-1

      - name: Delete DynamoDB Lock Table
        run: |
          echo "Deleting DynamoDB table terraform-locks"
          aws dynamodb delete-table --table-name terraform-locks --region eu-central-1

      - name: Delete S3 Backend Bucket
        run: |
          BUCKET="maya-terraform-state-123456"
          echo "Deleting all objects and versions in $BUCKET"

          aws s3api list-object-versions --bucket $BUCKET --query 'Versions[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          aws s3api list-object-versions --bucket $BUCKET --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' --output json | \
          jq -c '.[]' | while read obj; do
            KEY=$(echo $obj | jq -r '.Key')
            VID=$(echo $obj | jq -r '.VersionId')
            aws s3api delete-object --bucket $BUCKET --key "$KEY" --version-id "$VID"
          done

          aws s3 rb s3://$BUCKET
