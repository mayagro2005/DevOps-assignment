name: Terraform Destroy

on:
  workflow_dispatch:   # Can run manually from GitHub UI

jobs:
  destroy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION:           ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      # --- Destroy main infrastructure (EC2, Security Groups, etc.) ---
      - name: Terraform Init Main
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Destroy Main
        run: terraform destroy -auto-approve -var "aws_region=${{ secrets.AWS_REGION }}"
        working-directory: ./terraform

      # --- Destroy bootstrap resources (S3 + DynamoDB) using AWS CLI ---
      - name: Delete DynamoDB Table
        run: |
          echo "Deleting DynamoDB table: terraform-locks"
          aws dynamodb delete-table --table-name terraform-locks --region $AWS_REGION

      - name: Delete S3 Backend Bucket
        run: |
          echo "Deleting S3 bucket: maya-terraform-state-123456"
          aws s3 rb s3://maya-terraform-state-123456 --force
