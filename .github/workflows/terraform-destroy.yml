name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v2

    # Destroy main infra (EC2, Security Groups)
    - name: Terraform Init Main
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Destroy Main
      run: terraform destroy -auto-approve -var "aws_region=${{ secrets.AWS_REGION }}"
      working-directory: ./terraform

    # Destroy bootstrap infra (S3 + DynamoDB)
    - name: Terraform Init Bootstrap
      run: terraform init -reconfigure -backend=false
      working-directory: ./bootstrap

    - name: Terraform Destroy (bootstrap)
      run: terraform destroy -auto-approve \
        -var "aws_region=${{ secrets.AWS_REGION }}" \
        -var "state_bucket=maya-terraform-state-123456" \
        -var "lock_table=terraform-locks"
      working-directory: ./bootstrap

